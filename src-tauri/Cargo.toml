[package]
name = "my-snip"
version = "0.1.1"
description = "A lightweight formula capture tool"
authors = ["My Snip"]
edition = "2021"
rust-version = "1.85"

[features]
custom-protocol = ["tauri/custom-protocol"]
diagnostics = ["arboard/image-data"]

[lib]
name = "my_snip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
futures-util = "0.3"
base64 = "0.22"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9"
arboard = { version = "3", default-features = false }
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native"] }
zeroize = "1"
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
